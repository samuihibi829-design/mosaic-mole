<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRコード印刷用｜輪を組む（管理者用）</title>
<style>
  :root{
    --navy:#141b38; --gold:#c9a24b; --gold-light:#eccf86;
    --cream:#f4efe1; --muted:#5a6284; --line:#dfe1ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:32px 20px 60px;
    background:#f6f6fa; color:var(--navy);
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  }
  .wrap{ max-width:960px; margin:0 auto; }
  h1{ font-size:22px; margin:0 0 6px; }
  .lede{ font-size:13px; color:var(--muted); line-height:1.8; margin:0 0 24px; max-width:640px; }

  .controls{
    display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; margin-bottom:28px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; flex:1; min-width:260px; }
  .field label{ font-size:11.5px; color:var(--muted); }
  .field input{
    padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit;
  }
  .print-btn{
    padding:11px 22px; border-radius:999px; border:1px solid var(--navy);
    background:var(--navy); color:#fff; font-size:13.5px; cursor:pointer;
    font-family:inherit;
  }
  .print-btn:hover{ opacity:0.9; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:18px;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px; text-align:center;
  }
  .card .no{
    font-size:11px; color:var(--gold-dim, #8b6a22); letter-spacing:0.1em;
    margin-bottom:4px;
  }
  .card .label{ font-size:14px; font-weight:700; margin-bottom:10px; }
  .card img{ width:100%; max-width:180px; height:auto; display:block; margin:0 auto 10px; }
  .card .url{
    font-size:9.5px; color:var(--muted); word-break:break-all; line-height:1.5;
  }

  @media print{
    body{ background:#fff; padding:0; }
    .controls{ display:none; }
    .lede{ display:none; }
    .grid{ grid-template-columns:repeat(3, 1fr); }
    .card{ break-inside:avoid; box-shadow:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>QRコード印刷シート（管理者用）</h1>
  <p class="lede">
    このページは来場者には公開しません。GitHub Pages公開後のURLを入力すると、
    10箇所ぶんのQRコードが自動生成されます。内容を確認のうえ、そのまま印刷してご利用ください。
    ラベル（設置場所名）は下の入力欄で書き換えられます。QR画像は
    <a href="https://goqr.me/api/" target="_blank" rel="noopener">goqr.me の無料QR生成API</a>
    を都度呼び出して表示しているだけなので、このファイル自体に画像は保存されません（印刷時は画面に表示された内容がそのまま出力されます）。
  </p>

  <div class="controls">
    <div class="field">
      <label>公開後の ring.html への完全なURL</label>
      <input type="text" id="baseUrl" placeholder="https://samuihibi829-design.github.io/ring-tree-static/ring.html">
    </div>
    <button class="print-btn" id="printBtn">印刷する</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
  const SPOTS = [
    { id: "r-b1", label: "1階 中央広場" },
    { id: "r-b2", label: "1階 南入口" },
    { id: "r-b3", label: "1階 北入口" },
    { id: "r-b4", label: "1階 フードコート" },
    { id: "r-c1", label: "2階 サービスカウンター前" },
    { id: "r-c2", label: "2階 エスカレーター横" },
    { id: "r-c3", label: "2階 キッズスペース" },
    { id: "r-d1", label: "3階 シネマ前" },
    { id: "r-d2", label: "3階 屋上広場入口" },
    { id: "r-e1", label: "屋上 ツリー前" },
  ];

  const grid = document.getElementById("grid");
  const baseUrlInput = document.getElementById("baseUrl");
  const printBtn = document.getElementById("printBtn");

  const DEFAULT_BASE = localStorage.getItem("mmk_qr_base_url") || "";
  baseUrlInput.value = DEFAULT_BASE;

  function qrImageUrl(targetUrl){
    const encoded = encodeURIComponent(targetUrl);
    return `https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=10&data=${encoded}`;
  }

  function renderGrid(){
    const base = baseUrlInput.value.trim().replace(/\/$/, "");
    grid.innerHTML = "";
    SPOTS.forEach((spot, i) => {
      const url = base ? `${base}?spot=${spot.id}` : "";
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="no">SPOT ${String(i+1).padStart(2,"0")}</div>
        <div class="label">${spot.label}</div>
        ${url
          ? `<img src="${qrImageUrl(url)}" alt="QR for ${spot.id}">`
          : `<div style="padding:40px 0; color:#aaa; font-size:12px;">URLを入力してください</div>`}
        <div class="url">${url || ""}</div>
      `;
      grid.appendChild(card);
    });
  }

  baseUrlInput.addEventListener("input", () => {
    localStorage.setItem("mmk_qr_base_url", baseUrlInput.value.trim());
    renderGrid();
  });
  printBtn.addEventListener("click", () => window.print());

  renderGrid();
</script>
</body>
</html>
