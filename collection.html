<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MY COLLECTION — FLOWER PASSPORT</title>

  <style>
    :root {
      --paper: #f2ecdf;
      --ink: #17372b;
      --muted: #7c817b;
      --line: rgba(23, 55, 43, 0.18);
      --accent: #6f332d;

      --paper-noise: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='300'%20height='300'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.9'%20numOctaves='2'%20stitchTiles='stitch'%20result='noise'/%3E%3CfeColorMatrix%20in='noise'%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family:
        "Courier New",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        monospace;

      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      min-height: 100vh;

      padding: 38px 26px 100px;

      background-color: var(--paper);

      background-image:
        var(--paper-noise),
        repeating-linear-gradient(
          115deg,
          rgba(23, 55, 43, 0.02) 0px,
          rgba(23, 55, 43, 0.02) 1px,
          transparent 1px,
          transparent 5px
        ),
        radial-gradient(
          ellipse 700px 500px at 12% -4%,
          rgba(255, 255, 255, 0.55),
          transparent 60%
        ),
        radial-gradient(
          ellipse 700px 600px at 105% 105%,
          rgba(23, 55, 43, 0.07),
          transparent 65%
        );

      background-repeat: repeat, repeat, no-repeat, no-repeat;
      background-blend-mode: multiply, multiply, normal, normal;

      box-shadow: inset 0 0 80px rgba(23, 55, 43, 0.06);
    }

    .back-link {
      display: inline-block;

      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--muted);

      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;

      margin-bottom: 44px;
    }

    .title {
      font-size: 13px;
      letter-spacing: 0.2em;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .count {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .empty {
      padding: 40px 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.9;
    }

    .empty a {
      color: var(--ink);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    @media (min-width: 560px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      border: 1px solid var(--line);
      padding: 22px 20px;
      position: relative;
      background-color: rgba(255,255,255,0.15);

      background-image:
        var(--paper-noise),
        radial-gradient(
          ellipse 260px 200px at 10% 0%,
          rgba(255, 255, 255, 0.45),
          transparent 65%
        );

      background-repeat: repeat, no-repeat;
      background-blend-mode: multiply, normal;

      box-shadow:
        0 1px 0 rgba(23, 55, 43, 0.05),
        0 8px 16px rgba(23, 55, 43, 0.06);
    }

    .card-flower {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      margin-bottom: 4px;
    }

    .card-id {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .card-row span:last-child {
      color: var(--ink);
    }

    .card-barcode {
      margin-top: 16px;
      margin-bottom: 8px;
    }

    .card-barcode svg {
      display: block;
    }

    .card-code {
      font-size: 10px;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .card-benefit {
      font-size: 9px;
      color: var(--accent);
      letter-spacing: 0.06em;
    }

    .card-stamp {
      position: absolute;
      top: 18px;
      right: 18px;

      font-size: 8px;
      letter-spacing: 0.08em;
      color: var(--accent);

      border: 1px solid var(--accent);
      border-radius: 50%;

      width: 34px;
      height: 34px;

      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      opacity: 0.75;
      transform: rotate(-8deg);
    }

    @media (min-width: 700px) {
      body {
        background: #e6dfd1;
      }

      .wrap {
        box-shadow:
          inset 0 0 80px rgba(23, 55, 43, 0.06),
          0 0 60px rgba(0,0,0,.06);
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <a class="back-link" href="flower-passport-journey.html">
      ← BACK TO PASSPORT
    </a>

    <div class="title">
      MY COLLECTION
    </div>

    <div class="subtitle">
      Every flower whose journey you have<br>
      followed to completion, gathered here.
    </div>

    <div class="count" id="count"></div>

    <div id="content"></div>

  </div>


  <script>

    function hashToSeed(str) {

      let hash = 0;

      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }

      return Math.abs(hash) || 1;

    }


    function mulberry32(seed) {

      return function () {

        seed |= 0;
        seed = (seed + 0x6D2B79F5) | 0;

        let t = Math.imul(
          seed ^ (seed >>> 15),
          1 | seed
        );

        t = (t + Math.imul(
          t ^ (t >>> 7),
          61 | t
        )) ^ t;

        return (
          (t ^ (t >>> 14)) >>> 0
        ) / 4294967296;

      };

    }


    function buildBarcode(
      code,
      color = "var(--ink)",
      totalWidth = 200,
      height = 40
    ) {

      const rand =
        mulberry32(hashToSeed(code));

      let bars = "";
      let x = 0;

      while (x < totalWidth) {

        const w =
          1 + Math.floor(rand() * 3);

        if (rand() > 0.42) {

          bars += `<rect x="${x}" y="0" width="${w}" height="${height}" fill="currentColor"></rect>`;

        }

        x += w;

      }

      return `<svg viewBox="0 0 ${totalWidth} ${height}" width="100%" height="${height}" xmlns="http://www.w3.org/2000/svg" style="color:${color}">${bars}</svg>`;

    }


    function formatDate(iso) {

      try {

        const d = new Date(iso);

        return d
          .toISOString()
          .slice(0, 10)
          .replace(/-/g, ".");

      } catch (e) {

        return "—";

      }

    }


    function loadCollection() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "flowerPassportCollection"
          ) || "[]"
        );

      } catch (e) {

        return [];

      }

    }


    function render() {

      const items = loadCollection();

      const countEl =
        document.getElementById("count");

      const contentEl =
        document.getElementById("content");

      countEl.textContent =
        items.length +
        (items.length === 1
          ? " FLOWER COLLECTED"
          : " FLOWERS COLLECTED");

      if (items.length === 0) {

        contentEl.innerHTML = `
          <div class="empty">
            NO FLOWERS COLLECTED YET.<br><br>
            Complete a flower's full journey on the
            <a href="flower-passport-journey.html">FLOWER PASSPORT</a>
            page to add it here.
          </div>
        `;

        return;

      }

      const grid =
        document.createElement("div");

      grid.className = "grid";

      items
        .slice()
        .reverse()
        .forEach(item => {

          const card =
            document.createElement("div");

          card.className = "card";

          const accent =
            item.accentColor || "var(--accent)";

          const paperTint =
            item.paperTint || "transparent";

          card.style.borderColor = accent;
          card.style.backgroundColor = paperTint;

          card.innerHTML = `
            <div class="card-stamp" style="color:${accent};border-color:${accent}">DONE</div>
            <div class="card-flower">${item.flower || "UNKNOWN"}</div>
            <div class="card-id">${item.id || ""}</div>

            <div class="card-row">
              <span>ORIGIN</span>
              <span>${item.origin || "—"}</span>
            </div>

            <div class="card-row">
              <span>COMPLETED</span>
              <span>${formatDate(item.completedAt)}</span>
            </div>

            <div class="card-barcode">
              ${buildBarcode(item.code || item.id || "", accent)}
            </div>

            <div class="card-code">${item.code || ""}</div>
            <div class="card-benefit" style="color:${accent}">PRESENT AT NEXT STAY FOR A BENEFIT</div>
          `;

          grid.appendChild(card);

        });

      contentEl.appendChild(grid);

    }


    render();

  </script>

</body>
</html>
